# nginx dentro do contentor "web": serve o React (SPA) e encaminha /api para o contentor "api".
# O HTTPS (certificado de chuanga-studio.com) fica no proxy do servidor, à frente deste.

# Mantém o protocolo original (https) que o proxy do servidor indicou.
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Fotos da galeria/chat (o backend aceita até 20 MB por pedido)
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Usado pelo healthcheck do Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API: vai para o serviço "api" do compose (DNS interno do Docker, revalidado a cada 10 s,
    # para não perder a ligação quando o contentor da API é recriado).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://api:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Ficheiros com hash no nome (gerados pelo Vite): podem ficar em cache um ano.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # O index.html nunca fica em cache, para que um deploy novo apareça logo.
    location = /index.html {
        expires -1;
    }

    # SPA: qualquer rota (/servicos, /admin/...) devolve o index.html e o React trata do resto.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
